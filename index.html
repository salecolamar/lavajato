<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Brilho Total</title>
<meta name="description" content="Agendamento online de lavagem de carros.">

<meta name="theme-color" content="#0A0A0A">
<meta name="background-color" content="#0A0A0A">

<!-- iOS: comportamento de app em tela cheia -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brilho Total">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<!-- Android / geral -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#0A0A0A;
    --surface:#161616;
    --surface-2:#1F1F1F;
    --surface-3:#2A2A2A;
    --border:#302B1A;
    --text:#F5F3EC;
    --text-muted:#9A9689;
    --accent:#FFD400;
    --accent-strong:#FFE569;
    --accent-soft:#2B2408;
    --accent-contrast:#0A0A0A;
    --success:#3ECF6E;
    --success-bg:#132A1C;
    --warning:#FF9F1C;
    --warning-bg:#3A2408;
    --danger:#FF5C5C;
    --danger-bg:#331414;
    --neutral:#9A9689;
    --neutral-bg:#232323;
    --shadow: 0 4px 14px rgba(0,0,0,0.5);
    --radius: 12px;
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  h1,h2,h3{
    font-family:var(--font-display);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.02em;
    text-wrap:balance;
    margin:0 0 4px 0;
    color:var(--text);
  }
  p{ margin:0 0 0.6em 0; }
  .muted{ color:var(--text-muted); }
  a{ color:var(--accent); }
  button{ font-family:inherit; touch-action:manipulation; }
  input,select,textarea{ font-family:var(--font-body); }
  ::selection{ background:var(--accent-soft); }

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:980px; margin:0 auto;
    padding:24px 20px 28px;
    display:flex; align-items:center; justify-content:center; gap:16px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:48px; height:48px; border-radius:10px; border:none; padding:0; margin:0;
    background:linear-gradient(160deg, var(--accent), var(--accent-strong));
    display:flex; align-items:center; justify-content:center;
    color:var(--accent-contrast); font-family:var(--font-display); font-weight:700; font-size:20px;
    flex-shrink:0; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .brand-mark:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .brand-name{ font-family:var(--font-display); font-size:20px; font-weight:600; text-transform:uppercase; letter-spacing:0.02em; }
  .brand-tag{ font-size:12px; color:var(--text-muted); margin-top:-2px; }

  .container{ max-width:980px; margin:0 auto; padding:24px 20px 64px; }
  .subnav{ display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:0; }
  .subnav button{
    border:none; background:transparent; color:var(--text-muted); cursor:pointer;
    padding:10px 4px; margin-right:18px; font-size:14px; font-weight:600;
    border-bottom:2px solid transparent; position:relative; top:1px;
  }
  .subnav button.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .subnav button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .subnav-spacer{ flex:1; }
  .subnav .ghost-link{ font-weight:500; color:var(--text-muted); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow);
  }
  .card + .card{ margin-top:16px; }
  .card-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .stack{ display:flex; flex-direction:column; gap:16px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .grid-2{ grid-template-columns:1fr; } }

  label{ display:block; font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:5px; }
  .field{ margin-bottom:14px; }
  input[type=text],input[type=tel],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:14px;
  }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  .hint{ font-size:12px; color:var(--text-muted); margin-top:4px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--accent); padding:10px 8px; }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-sm{ padding:6px 12px; font-size:13px; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-block{ width:100%; }

  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px;
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
  }
  .pill-pendente{ background:var(--warning); color:#1a1200; font-size:13px; padding:6px 14px; font-weight:800; }
  .pill-confirmado{ background:var(--accent-soft); color:var(--accent-strong); }
  .pill-pronto{ background:var(--success); color:#fff; font-size:13px; padding:6px 14px; box-shadow:var(--shadow); }
  .pill-concluido{ background:var(--success-bg); color:var(--success); }
  .pill-cancelado{ background:var(--neutral-bg); color:var(--neutral); }

  .alert-banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:var(--warning-bg); color:var(--warning); border:1px solid var(--warning);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:16px; font-weight:600; font-size:14px;
  }

  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  .service-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .service-card{
    border:1px solid var(--border); border-radius:var(--radius); padding:14px; background:var(--surface-2);
    cursor:pointer; position:relative; text-align:left;
  }
  .service-card.selected{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent) inset; }
  .service-card h3{ font-size:15px; margin-bottom:2px; }
  .service-card .desc{ font-size:12.5px; color:var(--text-muted); margin-bottom:10px; min-height:2.2em; }
  .service-card .meta{ display:flex; justify-content:space-between; align-items:baseline; font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .service-card .price{ font-weight:600; color:var(--accent-strong); font-size:15px; }
  .service-card .dur{ color:var(--text-muted); font-size:12px; }

  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin:12px 0 10px; }
  .cal-title{ font-family:var(--font-display); font-size:16px; text-transform:uppercase; letter-spacing:0.02em; }
  .cal-nav{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:18px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .cal-nav:disabled{ opacity:0.3; cursor:not-allowed; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:16px; }
  .cal-grid-head{ margin-bottom:2px; }
  .cal-dow{ text-align:center; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-muted); padding:4px 0; }
  .cal-cell{
    aspect-ratio:1; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:14px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .cal-cell.empty{ background:transparent; border-color:transparent; cursor:default; }
  .cal-cell.is-today:not(.selected){ border-color:var(--accent); color:var(--accent); font-weight:700; }
  .cal-cell:disabled{ opacity:0.3; cursor:not-allowed; }
  .cal-cell.is-closed{ opacity:0.3; }
  .cal-cell.is-blocked{ background:var(--danger-bg); border-color:var(--danger); color:var(--danger); opacity:0.75; }
  .cal-cell.is-full{ background:var(--warning-bg); border-color:var(--warning); color:var(--warning); opacity:0.85; }
  .cal-cell.selected{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); font-weight:700; opacity:1; }
  .cal-legend{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; font-size:11px; color:var(--text-muted); }
  .cal-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .cal-legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  .cal-shortcuts{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .slot-section-title{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-muted); margin:14px 0 8px; }
  .slot-section-title:first-of-type{ margin-top:4px; }

  .slot-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; }
  .slot-btn{
    padding:9px 4px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
    font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:14px; cursor:pointer; text-align:center;
  }
  .slot-btn.selected{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); font-weight:600; }

  .steps{ display:flex; gap:6px; margin-bottom:16px; }
  .step-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .step-dot{ width:100%; height:4px; border-radius:4px; background:var(--surface-3); }
  .step-item.done .step-dot{ background:var(--accent); }
  .step-item.active .step-dot{ background:var(--accent-strong); box-shadow:0 0 0 3px var(--accent-soft); }
  .step-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-muted); text-align:center; }
  .step-item.done .step-label{ color:var(--text); }
  .step-item.active .step-label{ color:var(--accent); font-weight:700; }
  .booking-summary{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 14px; margin-bottom:16px; font-size:13px;
  }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-muted); padding:8px 10px; border-bottom:1px solid var(--border); }
  td{ padding:10px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; }

  .empty{ text-align:center; padding:40px 16px; color:var(--text-muted); }
  .empty .big{ font-size:32px; margin-bottom:8px; }

  .toast-root{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{ background:var(--text); color:var(--bg); padding:10px 18px; border-radius:8px; font-size:13.5px; box-shadow:var(--shadow); }

  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:18px; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; }
  .stat .n{ font-family:var(--font-display); font-size:26px; }
  .stat .l{ font-size:11.5px; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.03em; }

  .badge-readonly{ background:var(--warning-bg); color:var(--warning); border-radius:8px; padding:8px 12px; font-size:13px; margin-bottom:16px; }
  .weekday-check{ display:flex; gap:6px; flex-wrap:wrap; }
  .weekday-check label{ display:flex; align-items:center; gap:6px; font-weight:500; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; cursor:pointer; }
  .weekday-check input{ width:auto; }
  .chip-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 10px 5px 12px; font-size:13px; }
  .chip button{ border:none; background:transparent; color:var(--text-muted); cursor:pointer; font-size:14px; line-height:1; padding:0; }

  .install-row{ display:flex; gap:10px; margin-top:14px; }
  .install-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:8px;
    padding:11px 10px; color:var(--accent-strong); font-weight:700; font-size:13px; cursor:pointer;
  }
  .install-btn svg{ flex-shrink:0; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width:640px){ .modal-overlay{ align-items:center; } }
  .modal-box{
    background:var(--surface); border-radius:16px 16px 0 0; padding:20px; width:100%; max-width:440px;
    max-height:85vh; overflow-y:auto; box-shadow:var(--shadow);
  }
  @media (min-width:640px){ .modal-box{ border-radius:16px; } }
  .modal-box .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-box h2{ margin:0; font-size:17px; }
  .modal-close{ border:none; background:var(--surface-2); color:var(--text-muted); width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:16px; line-height:1; }
  .install-help ol{ padding-left:20px; margin:0 0 14px; }
  .install-help li{ margin-bottom:4px; }
  .install-help .fine{ font-size:11.5px; color:var(--text-muted); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root" class="toast-root"></div>
<script id="app-logic" type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getFirestore, doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc,
  onSnapshot, arrayUnion
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getMessaging, getToken, onMessage, isSupported as messagingIsSupported } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js';

(function(){
  "use strict";

  var SESSION_KEY = 'lavajato_session_v1';

  // ---- Firebase: substitua pelos valores reais do seu projeto (veja o guia que o Claude te passou) ----
  var firebaseConfig = {
    apiKey: 'AIzaSyC0pO6cmfg-zwy6VHbw8u_GLTRKKF8-ayo',
    authDomain: 'lava-jato-eaa4c.firebaseapp.com',
    projectId: 'lava-jato-eaa4c',
    storageBucket: 'lava-jato-eaa4c.firebasestorage.app',
    messagingSenderId: '1070905124396',
    appId: '1:1070905124396:web:6bac64f732a810ae6dd389',
  };
  // Cloud Messaging → Certificados push da Web → Gerar par de chaves.
  var VAPID_KEY = 'BBSzEXv9F0xUqCbgGBx1eUgmGjiQRrzYpbGmudQoYpyK3dwIHgZOJQieL7meJVpQB94L4yeqXX1Svo1CwdKaRSw';

  var fbApp = initializeApp(firebaseConfig);
  var db = getFirestore(fbApp);
  var auth = getAuth(fbApp);
  var authReady = signInAnonymously(auth).catch(function(err){ console.error('Falha no login anonimo do Firebase:', err); });

  var CONFIG_REF = doc(db, 'config', 'geral');
  var COL = {
    clients: collection(db, 'clients'),
    cars: collection(db, 'cars'),
    appointments: collection(db, 'appointments'),
    services: collection(db, 'services')
  };

  function defaultAvailability(){
    return { workDays:[1,2,3,4,5,6], startTime:'08:00', endTime:'18:00', slotMinutes:30, blockedDates:[] };
  }

  /* ---------- state (sincronizado em tempo real com o Firestore) ---------- */
  var state = {
    businessName: 'LAVA JATO',
    adminPin: '1234',
    whatsappNumber: '',
    services: [],
    availability: defaultAvailability(),
    clients: [],
    cars: [],
    appointments: [],
    adminTokens: []
  };

  function watchCollection(name, colRef){
    onSnapshot(colRef, function(snap){
      state[name] = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(err){ console.error('Erro ao sincronizar ' + name + ':', err); });
  }

  function seedServicesIfEmpty(){
    return getDocs(COL.services).then(function(snap){
      if(!snap.empty) return;
      var defaults = [
        { id:'s1', name:'Lavagem Simples', description:'Lavagem externa completa com secagem', durationMin:30, priceCents:3500 },
        { id:'s2', name:'Lavagem Completa', description:'Externa e interna, painel e tapetes', durationMin:60, priceCents:6000 },
        { id:'s3', name:'Lavagem + Cera', description:'Lavagem completa com aplicacao de cera protetora', durationMin:90, priceCents:9000 },
        { id:'s4', name:'Higienizacao Interna', description:'Bancos, forracao e carpete', durationMin:75, priceCents:8000 },
        { id:'s5', name:'Polimento', description:'Remocao de riscos leves e brilho na pintura', durationMin:120, priceCents:15000 }
      ];
      return Promise.all(defaults.map(function(s){
        return setDoc(doc(db, 'services', s.id), {
          name: s.name, description: s.description, durationMin: s.durationMin, priceCents: s.priceCents
        });
      }));
    });
  }

  function bootFirebase(){
    return authReady.then(function(){
      return getDoc(CONFIG_REF);
    }).then(function(snap){
      if(!snap.exists()){
        return setDoc(CONFIG_REF, { businessName:'LAVA JATO', adminPin:'1234', availability: defaultAvailability(), adminTokens: [] });
      }
    }).then(seedServicesIfEmpty).then(function(){
      onSnapshot(CONFIG_REF, function(snap){
        var c = snap.data() || {};
        state.businessName = c.businessName || 'LAVA JATO';
        state.adminPin = c.adminPin || '1234';
        state.whatsappNumber = c.whatsappNumber || '';
        state.availability = c.availability || defaultAvailability();
        state.adminTokens = c.adminTokens || [];
        render();
      });
      watchCollection('clients', COL.clients);
      watchCollection('cars', COL.cars);
      watchCollection('appointments', COL.appointments);
      watchCollection('services', COL.services);
    }).catch(function(err){
      console.error('Erro ao iniciar Firebase:', err);
      toast('Nao foi possivel conectar ao banco de dados.');
    });
  }

  var CLIENT_ID_KEY = 'lavajato_client_id_v1';
  var SESSION = loadSession();

  function loadSession(){
    var def = { role:'cliente', clientId:null, adminAuthed:false, clientTab:'agendar', adminTab:'agenda', booking:{ serviceIds:[], carId:null, date:null, time:null, step:1 } };
    var savedClientId = null;
    try{ savedClientId = localStorage.getItem(CLIENT_ID_KEY); }catch(e){}
    var merged;
    try{
      var raw = sessionStorage.getItem(SESSION_KEY);
      if(!raw){ merged = def; }
      else{
        var parsed = JSON.parse(raw);
        merged = Object.assign(def, parsed, { booking: Object.assign({}, def.booking, parsed.booking||{}) });
      }
    }catch(e){ merged = def; }
    if(!merged.clientId && savedClientId) merged.clientId = savedClientId;
    return merged;
  }
  function saveSession(){
    try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); }catch(e){}
    try{
      if(SESSION.clientId) localStorage.setItem(CLIENT_ID_KEY, SESSION.clientId);
      else localStorage.removeItem(CLIENT_ID_KEY);
    }catch(e){}
  }

  /* ---------- utils ---------- */
  function esc(s){

  function formatDateBR(dateStr){

  function timeToMin(t){ var p=t.split(':'); return (+p[0])*60 + (+p[1]); }

  function formatDuration(min){
    if(min < 60) return min + ' min';
    var h = Math.floor(min/60), m = min%60;
    return h + 'h' + (m? ' ' + m + 'min' : '');
  }
  function maskPhone(v){
    var d = onlyDigits(v).slice(0,11);
    if(!d.length) return '';
    if(d.length <= 2) return '(' + d;
    if(d.length <= 6) return '(' + d.slice(0,2) + ') ' + d.slice(2);
    if(d.length <= 10) return '(' + d.slice(0,2) + ') ' + d.slice(2,6) + '-' + d.slice(6);
    return '(' + d.slice(0,2) + ') ' + d.slice(2,7) + '-' + d.slice(7);
  }

    return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7);

  function findNextAvailableDate(dur){
    var start = new Date();
    for(var i=0;i<BOOKING_WINDOW_DAYS;i++){
      var cand = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
      var ds = toDateStr(cand);
      if(isDayOpen(ds) && computeAvailableSlots(ds, dur, null).length>0) return ds;
    }
    return null;
  }

  function clientAppointments(clientId){
    return state.appointments.filter(function(a){ return a.clientId===clientId; })
      .slice().sort(function(a,b){ return (b.date+b.time).localeCompare(a.date+a.time); });
  }
  function totalDuration(serviceIds){
    return serviceIds.reduce(function(sum,id){ var s=findService(id); return sum + (s? s.durationMin : 0); }, 0);
  }
  function totalPrice(serviceIds){
    return serviceIds.reduce(function(sum,id){ var s=findService(id); return sum + (s? s.priceCents : 0); }, 0);
  }
  function getBusyIntervals(dateStr, excludeId){
    return state.appointments.filter(function(a){ return a.date===dateStr && a.status!=='cancelado' && a.id!==excludeId; })
      .map(function(a){ var start=timeToMin(a.time); return [start, start+totalDuration(a.serviceIds)]; });
  }
  function computeAvailableSlots(dateStr, durationMin, excludeId){
    var d = new Date(dateStr+'T00:00:00');
    var weekday = d.getDay();
    var av = state.availability;
    if(av.workDays.indexOf(weekday) === -1) return [];
    if(av.blockedDates.indexOf(dateStr) !== -1) return [];
    var startMin = timeToMin(av.startTime);
    var endMin = timeToMin(av.endTime);
    var busy = getBusyIntervals(dateStr, excludeId);
    var now = new Date();
    var isToday = dateStr === toDateStr(now);
    var nowMin = now.getHours()*60 + now.getMinutes();
    var slots = [];
    for(var t=startMin; t+durationMin<=endMin; t+=av.slotMinutes){
      if(isToday && t <= nowMin) continue;
      var overlaps = busy.some(function(iv){ return t < iv[1] && (t+durationMin) > iv[0]; });
      if(!overlaps) slots.push(minToTime(t));
    }
    return slots;
  }
  function isDayOpen(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    var av = state.availability;
    return av.workDays.indexOf(d.getDay()) !== -1 && av.blockedDates.indexOf(dateStr) === -1;
  }

  /* ---------- notificacoes: pede permissao + token FCM e salva em algum lugar ---------- */
  // Enquanto o app esta aberto na tela, o service worker nao mostra a
  // notificacao do sistema (isso so acontece com o app fechado/em segundo
  // plano) - entao avisamos com um toast dentro do proprio app.
  var foregroundHandlerRegistered = false;
  function registerForegroundMessages(messaging){
    if(foregroundHandlerRegistered) return;
    foregroundHandlerRegistered = true;
    onMessage(messaging, function(payload){
      var n = payload.notification || {};
      toast((n.title? n.title + ': ' : '') + (n.body || 'Voce tem uma notificacao nova.'));
    });
  }

  function pedirTokenPush(){
    return messagingIsSupported().then(function(supported){
      if(!supported) return null;
      if(!VAPID_KEY || VAPID_KEY === 'sua-vapid-key-aqui') return null;
      return Notification.requestPermission().then(function(perm){
        if(perm !== 'granted') return null;
        return navigator.serviceWorker.ready.then(function(registration){
          var messaging = getMessaging(fbApp);
          registerForegroundMessages(messaging);
          return getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
        });
      });
    }).catch(function(err){ console.error('Erro ao pedir permissao de notificacao:', err); return null; });
  }

  var renderPending = false;
  function isTypingField(el){
    if(!el) return false;
    if(el.tagName === 'TEXTAREA') return true;
    if(el.tagName === 'INPUT'){
      var t = (el.type || 'text').toLowerCase();
      return ['text','tel','email','password','number','search','date'].indexOf(t) !== -1;
    }
    return false;
  }
  function render(){
    var app = document.getElementById('app');
    if(!app) return;
    var active = document.activeElement;
    if(active && app.contains(active) && isTypingField(active)){
      renderPending = true;
      return;
    }
    doRender();
  }

  function renderCalendar(b, dur){
    var today = new Date();
    var todayStr = toDateStr(today);
    var maxDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() + BOOKING_WINDOW_DAYS);
    var viewYear = b.calYear != null ? b.calYear : today.getFullYear();
    var viewMonth = b.calMonth != null ? b.calMonth : today.getMonth();
    var isCurrentMonth = (viewYear === today.getFullYear() && viewMonth === today.getMonth());
    var firstOfNextMonth = new Date(viewYear, viewMonth + 1, 1);
    var nextDisabled = firstOfNextMonth > maxDate;
    var firstOfMonth = new Date(viewYear, viewMonth, 1);
    var startWeekday = firstOfMonth.getDay();
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    var html = '<div class="cal-shortcuts">' +
      '<button type="button" class="btn btn-sm" data-action="cal-today">Hoje</button>' +
      '<button type="button" class="btn btn-sm" data-action="cal-tomorrow">Amanha</button>' +
      '<button type="button" class="btn btn-sm" data-action="cal-next-free">Proximo horario livre</button>' +
    '</div>';

    html += '<div class="cal-legend">' +
      '<span><i style="background:var(--surface-2);border:1px solid var(--border);"></i>Disponivel</span>' +
      '<span><i style="background:var(--danger-bg);border:1px solid var(--danger);"></i>Feriado/folga</span>' +
      '<span><i style="background:var(--warning-bg);border:1px solid var(--warning);"></i>Lotado</span>' +
      '<span><i style="opacity:0.3;background:var(--surface-2);border:1px solid var(--border);"></i>Fechado</span>' +
    '</div>';

    html += '<div class="cal-head">' +
      '<button type="button" class="cal-nav" data-action="cal-prev" ' + (isCurrentMonth?'disabled':'') + '>&lsaquo;</button>' +
      '<span class="cal-title">' + MONTH_NAMES[viewMonth] + ' ' + viewYear + '</span>' +
      '<button type="button" class="cal-nav" data-action="cal-next" ' + (nextDisabled?'disabled':'') + '>&rsaquo;</button>' +
    '</div>';

    html += '<div class="cal-grid cal-grid-head">';
    WEEKDAYS_SHORT.forEach(function(w){ html += '<div class="cal-dow">' + w + '</div>'; });
    html += '</div>';

    html += '<div class="cal-grid">';
    for(var i=0;i<startWeekday;i++){ html += '<div class="cal-cell empty"></div>'; }
    for(var day=1; day<=daysInMonth; day++){
      var cellDate = new Date(viewYear, viewMonth, day);
      var ds = toDateStr(cellDate);
      var isPast = ds < todayStr;
      var isTooFar = cellDate > maxDate;
      var isClosed = state.availability.workDays.indexOf(cellDate.getDay()) === -1;
      var isBlocked = state.availability.blockedDates.indexOf(ds) !== -1;
      var isFull = (!isPast && !isTooFar && !isClosed && !isBlocked && dur) ? computeAvailableSlots(ds, dur, null).length === 0 : false;
      var disabled = isPast || isTooFar || isClosed || isBlocked || isFull;
      var stateClass = (isPast || isTooFar) ? '' : isBlocked ? 'is-blocked' : isFull ? 'is-full' : isClosed ? 'is-closed' : '';
      var sel = b.date === ds;
      html += '<button type="button" class="cal-cell ' + stateClass + (sel?' selected':'') + (ds===todayStr?' is-today':'') + '" data-action="select-day" data-date="' + ds + '" ' + (disabled?'disabled':'') + '>' + day + '</button>';
    }
    html += '</div>';
    return html;
  }

  function renderStepsBar(step){
    var labels = ['Servicos','Carro','Data','Confirmar'];
    var html = '<div class="steps">';
    for(var i=1;i<=4;i++){
      var cls = step>i ? 'done' : (step===i ? 'active' : '');
      html += '<div class="step-item ' + cls + '"><div class="step-dot"></div><span class="step-label">' + labels[i-1] + '</span></div>';
    }
    html += '</div>';
    return html;
  }

  function renderAgendar(client){
    var b = SESSION.booking;
    var step = b.step || 1;
    var cars = clientCars(client.id);
    var backBtn = '<button type="button" class="btn-ghost" style="padding:0;margin-bottom:12px;font-size:13px;" data-action="booking-back">&lsaquo; Voltar</button>';

    var html = renderStepsBar(step);
    if(step !== 4) html += renderBookingSummary(b);

    if(step === 1){
      html += '<div class="card"><h2>1. Escolha os servicos</h2><p class="muted">Voce pode selecionar mais de um.</p>';
      html += '<div class="service-grid" style="margin-top:12px;">';
      state.services.forEach(function(s){
        var sel = b.serviceIds.indexOf(s.id) !== -1;
        html += '<button type="button" class="service-card ' + (sel?'selected':'') + '" data-action="toggle-service" data-id="' + s.id + '">' +
          '<h3>' + esc(s.name) + '</h3><div class="desc">' + esc(s.description) + '</div>' +
          '<div class="meta"><span class="dur">' + formatDuration(s.durationMin) + '</span><span class="price">' + formatBRL(s.priceCents) + '</span></div>' +
        '</button>';
      });
      html += '</div>';
      html += '<button type="button" class="btn btn-primary" style="margin-top:16px;" data-action="booking-next" ' + (b.serviceIds.length?'':'disabled') + '>Continuar</button>';
      html += '</div>';
      return html;
    }

    if(step === 2){
      html += '<div class="card">' + backBtn + '<h2>2. Escolha o carro</h2>';
      if(cars.length){
        html += '<div class="grid-2" style="margin-top:10px;margin-bottom:18px;">';
        cars.forEach(function(c){
          var sel = b.carId === c.id;
          html += '<button type="button" class="service-card ' + (sel?'selected':'') + '" data-action="select-car" data-id="' + c.id + '" style="text-align:left;">' +
            '<h3>' + esc(c.model) + '</h3><div class="desc">' + esc(c.brand) + ' &middot; ' + esc(c.color) + '</div>' +
            '<span class="mono">' + esc(c.plate.toUpperCase()) + '</span></button>';
        });
        html += '</div>';
        html += '<p class="muted" style="margin-bottom:6px;">Ou cadastre um carro novo:</p>';
      } else {
        html += '<p class="muted" style="margin:10px 0 6px;">Voce ainda nao tem um carro cadastrado. Cadastre um abaixo:</p>';
      }
      html += renderAddCarForm();
      html += '</div>';
      return html;
    }

    if(step === 3){
      var dur = totalDuration(b.serviceIds);
      html += '<div class="card">' + backBtn + '<h2>3. Escolha data e horario</h2>';
      html += renderCalendar(b, dur);
      if(b.date){
        var slots = computeAvailableSlots(b.date, dur, null);
        if(slots.length===0){
          html += '<p class="muted">Nenhum horario disponivel nesse dia para a duracao selecionada (' + formatDuration(dur) + '). Tente outra data.</p>';
        } else {
          var manha = slots.filter(function(t){ return timeToMin(t) < 720; });
          var tarde = slots.filter(function(t){ return timeToMin(t) >= 720; });
          if(manha.length){
            html += '<div class="slot-section-title">Manha</div><div class="slot-grid">';
            manha.forEach(function(t){ html += renderSlotButton(b, t); });
            html += '</div>';
          }
          if(tarde.length){
            html += '<div class="slot-section-title">Tarde</div><div class="slot-grid">';
            tarde.forEach(function(t){ html += renderSlotButton(b, t); });
            html += '</div>';
          }
        }
      }
      html += '</div>';
      return html;
    }

    var services = b.serviceIds.map(findService).filter(Boolean);
    var car = findCar(b.carId);
    html += '<div class="card">' + backBtn + '<h2>4. Confirmar</h2>';
    html += '<p style="margin:8px 0;"><strong>' + formatDateBR(b.date) + ' as <span class="mono">' + b.time + '</span></strong></p>';
    html += '<p class="muted" style="margin-bottom:4px;">' + services.map(function(s){ return esc(s.name); }).join(', ') + '</p>';
    html += '<p class="muted" style="margin-bottom:4px;">' + (car? esc(car.model) + ' - ' + esc(car.plate.toUpperCase()) : '') + '</p>';
    html += '<p style="font-size:18px;font-family:var(--font-display);margin:10px 0;">Total: <span class="mono">' + formatBRL(totalPrice(b.serviceIds)) + '</span> &middot; ' + formatDuration(totalDuration(b.serviceIds)) + '</p>';
    html += '<button class="btn btn-primary" data-action="confirm-booking">Confirmar agendamento</button>';
    html += '</div>';
    return html;
  }

    sel.disabled = false;
    var opts = '<option value="" disabled selected>Selecione o modelo</option>' +
      models.map(function(m){ return '<option value="' + esc(m) + '">' + esc(m) + '</option>'; }).join('') +
      '<option value="' + CAR_MODEL_OTHER + '">Outro modelo...</option>';
    sel.innerHTML = opts;
    toggleModelOther(false);
  }

  /* ---------- events ---------- */
  var ATTACHED = false;
  function attachOnce(){
    if(ATTACHED) return;
    ATTACHED = true;
    var app = document.getElementById('app');

    app.addEventListener('click', function(ev){
      if(ev.target.classList && ev.target.classList.contains('modal-overlay')){
        PWA.help = null; CONFIRM = null; render(); return;
      }
      var el = ev.target.closest('[data-action]');
      if(!el) return;
      var action = el.getAttribute('data-action');
      handleAction(action, el, ev);
    });

    app.addEventListener('change', function(ev){
      if(ev.target.matches('select[data-action="filter-status"]')){
        SESSION.apptFilter = ev.target.value;
        saveSession();
        render();
      } else if(ev.target.id === 'car-brand'){
        var wrap = document.getElementById('car-brand-other-wrap');
        var isOther = ev.target.value === CAR_BRAND_OTHER;
        if(wrap){
          wrap.style.display = isOther ? '' : 'none';
          if(isOther) document.getElementById('car-brand-other').focus();
        }
        populateModelSelect(ev.target.value);
      } else if(ev.target.id === 'car-model'){
        toggleModelOther(ev.target.value === CAR_MODEL_OTHER);
      }
    });

    app.addEventListener('input', function(ev){
      if(ev.target.id === 'f-phone'){
        ev.target.value = maskPhone(ev.target.value);
      } else if(ev.target.id === 'car-plate'){
        ev.target.value = maskPlate(ev.target.value);
      }
    });

    app.addEventListener('focusout', function(){
      if(renderPending){
        renderPending = false;
        setTimeout(doRender, 0);
      }
    }, true);

    app.addEventListener('submit', function(ev){
      var form = ev.target.closest('form[data-form]');
      if(!form) return;
      ev.preventDefault();
      if(document.activeElement && form.contains(document.activeElement)) document.activeElement.blur();
      handleForm(form.getAttribute('data-form'), form);
    });
  }

  var SECRET_TAP_WINDOW_MS = 2000;
  var SECRET_TAPS_NEEDED = 5;
  var secretTapTimes = [];
  function handleBrandSecretTap(){
    var now = Date.now();
    secretTapTimes = secretTapTimes.filter(function(t){ return now - t < SECRET_TAP_WINDOW_MS; });
    secretTapTimes.push(now);
    if(secretTapTimes.length >= SECRET_TAPS_NEEDED){
      secretTapTimes = [];
      SESSION.role = 'admin';
      saveSession(); render();
    }
  }

  function doClientCancel(id){
    updateDoc(doc(db,'appointments', id), { status:'cancelado' }).then(function(){ toast('Agendamento cancelado.'); }).catch(function(){ toast('Erro ao cancelar.'); });
  }
  function doRemoveCar(id){
    deleteDoc(doc(db,'cars', id)).then(function(){ toast('Carro removido.'); }).catch(function(){ toast('Erro ao remover carro.'); });
  }

  function handleAction(action, el){
    var id = el.getAttribute('data-id');
    if(action === 'brand-secret-click'){
      handleBrandSecretTap();
    } else if(action === 'client-tab'){
      SESSION.clientTab = el.getAttribute('data-tab');
      saveSession(); render();
    } else if(action === 'admin-tab'){
      SESSION.adminTab = el.getAttribute('data-tab');
      saveSession(); render();
    } else if(action === 'ver-pendentes'){
      SESSION.adminTab = 'agendamentos';
      SESSION.apptFilter = 'pendente';
      saveSession(); render();
    } else if(action === 'client-logout'){
      SESSION.clientId = null;
      SESSION.booking = { serviceIds:[], carId:null, date:null, time:null, step:1 };
      saveSession(); render();
    } else if(action === 'admin-logout' || action === 'admin-cancel'){
      SESSION.adminAuthed = false;
      SESSION.role = 'cliente';
      saveSession(); render();
    } else if(action === 'remove-car'){
      var hasActive = state.appointments.some(function(a){ return a.carId===id && a.status!=='cancelado' && a.status!=='concluido'; });
      if(hasActive){
        CONFIRM = { title:'Nao e possivel remover', message:'Esse carro tem agendamento(s) ativos. Cancele-os antes de remover o carro.', action:null };
      } else {
        CONFIRM = { title:'Remover carro', message:'Tem certeza que deseja remover esse carro?', action:'do-remove-car', id:id };
      }
      render();
    } else if(action === 'toggle-service'){
      var b = SESSION.booking;
      var idx = b.serviceIds.indexOf(id);
      if(idx===-1) b.serviceIds.push(id); else b.serviceIds.splice(idx,1);
      saveSession(); render();
    } else if(action === 'booking-next'){
      if(SESSION.booking.serviceIds.length){
        SESSION.booking.step = SESSION.booking.carId ? 3 : 2;
        saveSession(); render();
      }
    } else if(action === 'booking-back'){
      SESSION.booking.step = Math.max(1, (SESSION.booking.step||1) - 1);
      saveSession(); render();
    } else if(action === 'select-car'){
      SESSION.booking.carId = id;
      SESSION.booking.step = 3;
      saveSession(); render();
    } else if(action === 'select-day'){
      SESSION.booking.date = el.getAttribute('data-date');
      SESSION.booking.time = null;
      saveSession(); render();
    } else if(action === 'cal-prev' || action === 'cal-next'){
      var b2 = SESSION.booking;
      var today2 = new Date();
      var m = (b2.calMonth != null ? b2.calMonth : today2.getMonth()) + (action==='cal-next'?1:-1);
      var y = (b2.calYear != null ? b2.calYear : today2.getFullYear());
      if(m > 11){ m = 0; y++; } else if(m < 0){ m = 11; y--; }
      b2.calMonth = m; b2.calYear = y;
      saveSession(); render();
    } else if(action === 'cal-today' || action === 'cal-tomorrow' || action === 'cal-next-free'){
      var b3 = SESSION.booking;
      var dur3 = totalDuration(b3.serviceIds);
      var targetDs = null;
      if(action === 'cal-today'){
        targetDs = todayStr();
      } else if(action === 'cal-tomorrow'){
        var tmr = new Date(); tmr.setDate(tmr.getDate()+1);
        targetDs = toDateStr(tmr);
      } else {
        targetDs = findNextAvailableDate(dur3);
        if(!targetDs){ toast('Nenhum horario livre encontrado nos proximos ' + BOOKING_WINDOW_DAYS + ' dias.'); return; }
      }
      b3.date = targetDs;
      b3.time = null;
      var dd = new Date(targetDs + 'T00:00:00');
      b3.calYear = dd.getFullYear();
      b3.calMonth = dd.getMonth();
      saveSession(); render();
    } else if(action === 'select-time'){
      SESSION.booking.time = el.getAttribute('data-time');
      SESSION.booking.step = 4;
      saveSession(); render();
    } else if(action === 'confirm-booking'){
      var b = SESSION.booking;
      var apptData = { clientId: SESSION.clientId, carId: b.carId, serviceIds: b.serviceIds.slice(),
        date: b.date, time: b.time, status:'pendente', createdAt: Date.now() };
      addDoc(COL.appointments, apptData).then(function(ref){
        SESSION.booking = { serviceIds:[], carId:null, date:null, time:null, step:1 };
        SESSION.clientTab = 'meus-agendamentos';
        saveSession(); render();
        toast('Solicitacao enviada! Avisaremos quando o lava jato confirmar.');
        fetch('/api/notify-new-booking', {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ appointmentId: ref.id })
        }).catch(function(){});
      }).catch(function(){ toast('Nao foi possivel confirmar. Tente novamente.'); });
    } else if(action === 'remarcar'){
      var apptR = state.appointments.find(function(a){ return a.id===id; });
      if(!apptR) return;
      updateDoc(doc(db,'appointments', id), { status:'cancelado' }).catch(function(){});
      SESSION.booking = { serviceIds: apptR.serviceIds.slice(), carId: apptR.carId, date:null, time:null, step:3 };
      SESSION.clientTab = 'agendar';
      saveSession(); render();
      toast('Escolha o novo horario.');
    } else if(action === 'client-cancel'){
      var apptC = state.appointments.find(function(a){ return a.id===id; });
      if(!apptC) return;
      var hrs = hoursUntilAppt(apptC);
      if(hrs !== null && hrs < MIN_CANCEL_HOURS){
        CONFIRM = { title:'Prazo para cancelar', message:'Esse agendamento e em menos de ' + MIN_CANCEL_HOURS + ' horas. Cancelamentos com prazo curto precisam ser feitos direto com o lava jato.', action:null, whatsapp:true };
      } else {
        CONFIRM = { title:'Cancelar agendamento', message:'Tem certeza que deseja cancelar esse agendamento?', action:'do-client-cancel', id:id };
      }
      render();
    } else if(action === 'confirm-yes'){
      var c = CONFIRM;
      CONFIRM = null;
      if(c && c.action === 'do-client-cancel') doClientCancel(c.id);
      else if(c && c.action === 'do-remove-car') doRemoveCar(c.id);
      render();
    } else if(action === 'confirm-no'){
      CONFIRM = null; render();
    } else if(action === 'set-status'){
      var status = el.getAttribute('data-status');
      updateDoc(doc(db,'appointments', id), { status: status }).then(function(){
        toast('Status atualizado.');
        if(status === 'confirmado' || status === 'pronto'){
          fetch('/api/notify-status-change', {
            method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ appointmentId: id })
          }).catch(function(){});
        }
      }).catch(function(){ toast('Erro ao atualizar status.'); });
    } else if(action === 'remove-service'){
      deleteDoc(doc(db,'services', id)).then(function(){ toast('Servico removido.'); }).catch(function(){ toast('Erro ao remover servico.'); });
    } else if(action === 'unblock-date'){
      var ds = el.getAttribute('data-date');
      var remaining = state.availability.blockedDates.filter(function(x){ return x!==ds; });
      updateDoc(CONFIG_REF, { 'availability.blockedDates': remaining }).catch(function(){ toast('Erro ao desbloquear data.'); });
    } else if(action === 'enable-notifications'){
      NOTIF.busy = true; render();
      ativarNotificacoesAdmin().then(function(ok){
        NOTIF.busy = false;
        if(ok){
          NOTIF.active = true;
          try{ localStorage.setItem('lavajato_notif_v1', '1'); }catch(e){}
          toast('Notificacoes ativadas!');
        } else {
          toast('Nao foi possivel ativar. Verifique as permissoes do navegador.');
        }
        render();
      });
    } else if(action === 'install-android'){
      if(PWA.deferredPrompt){
        var promptEvent = PWA.deferredPrompt;
        PWA.deferredPrompt = null;
        promptEvent.prompt();
        promptEvent.userChoice.catch(function(){}).then(function(choice){
          if(!choice || choice.outcome !== 'accepted'){ PWA.help = 'android'; render(); }
        });
      } else {
        PWA.help = 'android'; render();
      }
    } else if(action === 'install-ios'){
      PWA.help = 'ios'; render();
    } else if(action === 'close-install-help'){
      PWA.help = null; render();
    }
  }

  function handleForm(name, form){
    if(name === 'identify'){
      var nameVal = form.querySelector('#f-name').value.trim();
      var phoneVal = onlyDigits(form.querySelector('#f-phone').value);
      if(!nameVal || !phoneVal){ toast('Preencha nome e telefone.'); return; }
      var existing = state.clients.find(function(c){ return c.phone === phoneVal; });
      if(existing){
        SESSION.clientId = existing.id;
        saveSession(); render();
        tentarAtivarNotificacoesCliente();
      } else {
        addDoc(COL.clients, { name: nameVal, phone: phoneVal, createdAt: Date.now() }).then(function(ref){
          SESSION.clientId = ref.id;
          saveSession(); render();
          tentarAtivarNotificacoesCliente();
        }).catch(function(){ toast('Nao foi possivel continuar. Tente novamente.'); });
      }
    } else if(name === 'add-car'){
      var plate = maskPlate(form.querySelector('#car-plate').value);
      var brandSel = form.querySelector('#car-brand').value;
      var brand = brandSel === CAR_BRAND_OTHER ? form.querySelector('#car-brand-other').value.trim() : brandSel;
      var modelSel = form.querySelector('#car-model').value;
      var model = modelSel === CAR_MODEL_OTHER ? form.querySelector('#car-model-other').value.trim() : modelSel.trim();
      var color = form.querySelector('#car-color').value.trim();
      if(!plate || !model || !brand || !color){ toast('Preencha todos os campos do carro.'); return; }
      if(!PLATE_RE.test(plate)){ toast('Placa invalida. Use o formato ABC1D23.'); return; }
      var dupPlate = state.cars.some(function(c){ return c.plate.toUpperCase() === plate; });
      if(dupPlate){ toast('Essa placa ja esta cadastrada.'); return; }
      addDoc(COL.cars, { clientId: SESSION.clientId, plate: plate, model: model, brand: brand, color: color })
        .then(function(ref){
          toast('Carro cadastrado.');
          if(SESSION.clientTab === 'agendar'){
            SESSION.booking.carId = ref.id;
            SESSION.booking.step = 3;
          }
          saveSession(); render();
        })
        .catch(function(){ toast('Erro ao cadastrar carro.'); });
    } else if(name === 'admin-login'){
      var pin = form.querySelector('#admin-pin').value.trim();
      if(pin === state.adminPin){
        SESSION.adminAuthed = true;
        saveSession(); render();
        var pending = pendingCount();
        if(pending > 0){
          toast('Voce tem ' + pending + ' agendamento' + (pending>1?'s':'') + ' pendente' + (pending>1?'s':'') + ' para aceitar!');
        }
      } else {
        toast('PIN incorreto.');
      }
    } else if(name === 'add-service'){
      var svName = form.querySelector('#sv-name').value.trim();
      var svDesc = form.querySelector('#sv-desc').value.trim();
      var svDur = parseInt(form.querySelector('#sv-dur').value, 10);
      var svPrice = Math.round(parseFloat(form.querySelector('#sv-price').value) * 100);
      if(!svName || !svDur || isNaN(svPrice)){ toast('Preencha os dados do servico.'); return; }
      addDoc(COL.services, { name: svName, description: svDesc, durationMin: svDur, priceCents: svPrice })
        .then(function(){ toast('Servico adicionado.'); }).catch(function(){ toast('Erro ao adicionar servico.'); });
    } else if(name === 'save-availability'){
      var checked = Array.from(form.querySelectorAll('input[name="wd"]:checked')).map(function(i){ return parseInt(i.value,10); });
      var start = form.querySelector('#av-start').value.trim();
      var end = form.querySelector('#av-end').value.trim();
      var slot = parseInt(form.querySelector('#av-slot').value, 10);
      if(!/^\d{2}:\d{2}$/.test(start) || !/^\d{2}:\d{2}$/.test(end)){ toast('Use o formato HH:MM para os horarios.'); return; }
      updateDoc(CONFIG_REF, { availability: { workDays:checked, startTime:start, endTime:end, slotMinutes:slot, blockedDates: state.availability.blockedDates } })
        .then(function(){ toast('Horarios salvos.'); }).catch(function(){ toast('Erro ao salvar horarios.'); });
    } else if(name === 'block-date'){
      var ds = form.querySelector('#block-date-input').value;
      if(!ds){ return; }
      updateDoc(CONFIG_REF, { 'availability.blockedDates': arrayUnion(ds) })
        .then(function(){ toast('Data bloqueada.'); }).catch(function(){ toast('Erro ao bloquear data.'); });
    } else if(name === 'save-config'){
      var bn = form.querySelector('#cfg-name').value.trim();
      var pn = form.querySelector('#cfg-pin').value.trim();
      var wa = onlyDigits(form.querySelector('#cfg-whatsapp').value);
      if(!bn || !pn){ toast('Preencha nome e PIN.'); return; }
      updateDoc(CONFIG_REF, { businessName: bn, adminPin: pn, whatsappNumber: wa })
        .then(function(){ toast('Configuracoes salvas.'); }).catch(function(){ toast('Erro ao salvar configuracoes.'); });
    }
  }

  // Se a permissao de notificacao ja tinha sido concedida numa visita
  // anterior, religa o aviso em primeiro plano (toast) sem precisar pedir
  // permissao de novo.
  function initForegroundMessagingIfGranted(){
    if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    messagingIsSupported().then(function(supported){
      if(!supported || !navigator.serviceWorker) return;
      return navigator.serviceWorker.ready.then(function(){
        registerForegroundMessages(getMessaging(fbApp));
      });
    }).catch(function(){});
  }

  /* ---------- init ---------- */
  render();
  bootFirebase();
  initForegroundMessagingIfGranted();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').then(function(registration){
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState === 'visible') registration.update();
        });
      }).catch(function(){});

      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }
})();
</script>
